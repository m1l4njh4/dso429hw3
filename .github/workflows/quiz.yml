name: Answer hourly quiz

on:
  schedule:
    # Every 10 minutes, off the top of the hour (GitHub delays :00 runs the most).
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quiz
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Solve unanswered rounds
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python run.py

      - name: Commit and push
        if: always()
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add answers state
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Answers $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
